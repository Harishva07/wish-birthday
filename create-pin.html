<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Passkey</title>
  <link rel="stylesheet" href="/assets/index-J5xXwUMm.css">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    /* Custom shake animation for error state */
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    /* Map text-magical-300 to your brand purple if missing */
    .text-magical-300 { color: #d8b4fe; }
    .bg-magical-600 { background-color: #9333ea; }
    .bg-magical-400 { background-color: #c084fc; }
  </style>
</head>
<body class="h-full bg-slate-950 font-sans text-slate-300 flex flex-col overflow-x-hidden scroll-smooth">
  <div id="root" class="h-full">
    <!-- Same background structure as other creator pages -->
    <div class="fixed inset-0 z-0 pointer-events-none">
      <div class="absolute inset-0 bg-slate-950"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-purple-900/20 via-slate-950/80 to-slate-950 z-10"></div>
    </div>
    
    <!-- Main content container -->
    <div class="flex-1 w-full mx-auto px-4 py-7 sm:p-6 flex flex-col justify-start md:justify-center relative z-10 pt-10 md:pt-6 transition-all duration-500 max-w-2xl">
      
      <!-- Top Bar -->
      <div class="flex items-center justify-between mb-8 backdrop-blur-xl bg-white/5 p-4 rounded-3xl border border-white/10 shadow-[0_0_30px_rgba(139,38,242,0.15)]">
        <div class="cursor-pointer hover:scale-105 transition-transform duration-300" aria-label="Go Back" onclick="window.history.back()">
          <div class="flex items-center justify-center select-none opacity-80 hover:opacity-100">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </div>
        </div>
        <div class="flex flex-col items-end">
          <div class="text-[10px] text-magical-300 uppercase tracking-[0.3em] font-bold mb-1">Creation Progress</div>
          <div class="text-xs text-white/50 font-serif italic">Step 7 of 8</div>
        </div>
      </div>
      
      <!-- Progress Bar (87.5% for step 7 of 8) -->
      <div class="w-full h-1.5 bg-white/5 mb-12 rounded-full overflow-hidden backdrop-blur-sm border border-white/5 relative">
        <div class="h-full bg-gradient-to-r from-purple-600 via-purple-400 to-amber-300 transition-all duration-700 ease-out shadow-[0_0_15px_rgba(139,38,242,0.6)] relative" style="width: 87.5%;">
          <div class="absolute top-0 right-0 w-8 h-full bg-white/40 blur-sm animate-pulse"></div>
        </div>
      </div>

      <!-- Main Form Area -->
      <div class="flex flex-col items-center">
        <div class="text-center w-full mb-8">
          <h2 class="text-3xl md:text-5xl font-serif text-white mb-2 drop-shadow-lg">Create their <span class="text-magical-300 text-5xl md:text-6xl" style="font-family: 'Dancing Script', cursive;">secret pin</span></h2>
          <p class="text-gray-400/80 font-serif italic text-lg">"Keep the surprise locked until they are ready."</p>
        </div>

        <!-- Glassmorphism PIN Container -->
        <div class="relative bg-gradient-to-b from-slate-900/40 to-slate-950/60 backdrop-blur-2xl rounded-[2.5rem] border border-white/10 shadow-2xl p-8 md:p-12 w-full max-w-md overflow-hidden flex flex-col items-center justify-center mb-10 transition-transform" id="pinBox">
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-32 bg-purple-400/10 blur-3xl rounded-full pointer-events-none"></div>
          
          <input type="password" id="createPinInput" maxlength="4" placeholder="••••" autocomplete="off" class="w-full bg-transparent border-b-2 border-white/20 text-white text-center text-5xl tracking-[0.4em] py-4 rounded-none outline-none focus:border-purple-500 transition-colors placeholder:text-white/20 font-mono font-bold" />
          <p class="text-red-400 text-sm mt-6 opacity-0 transition-opacity absolute bottom-4" id="errorMsg">Please enter exactly 4 digits.</p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 w-full mt-auto">
          <button onclick="window.history.back()" class="w-full sm:w-1/3 py-4 md:py-5 px-6 rounded-2xl md:rounded-3xl font-medium text-sm md:text-base tracking-wide transition-all duration-300 flex items-center justify-center gap-2 group backdrop-blur-md bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white">
            Back
          </button>
          <button id="nextBtn" class="w-full sm:w-2/3 py-4 md:py-5 px-6 rounded-2xl md:rounded-3xl font-medium text-sm md:text-base tracking-wide transition-all duration-300 flex items-center justify-center gap-2 group bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-500 hover:to-fuchsia-500 text-white border border-white/10 shadow-[0_5px_25px_rgba(147,51,234,0.3)]">
            <span id="btnText">Save & Continue</span>
            <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-300 group-hover:translate-x-1"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const input = document.getElementById('createPinInput');
    const nextBtn = document.getElementById('nextBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const errorMsg = document.getElementById('errorMsg');
    const pinBox = document.getElementById('pinBox');

    // Restrict input to digits only
    input.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if(e.target.value.length === 4) {
         errorMsg.style.opacity = '0';
      }
    });

    nextBtn.addEventListener('click', () => {
      const pin = input.value;
      if (pin.length === 4) {
        errorMsg.style.opacity = '0';
        
        // Save to localStorage so passkey.html can read it!
        localStorage.setItem('user_created_pin', pin);
        
        // Success Animation on Button
        btnText.innerText = 'Saved Successfully!';
        btnIcon.outerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        nextBtn.classList.remove('from-purple-600', 'to-fuchsia-600');
        nextBtn.classList.add('from-emerald-500', 'to-teal-500');
        
        setTimeout(() => {
          if (window.parent !== window) {
            window.parent.postMessage('pin_success', '*');
          } else {
            alert('PIN saved! (Standalone test)');
          }
        }, 800);
      } else {
        // Error State
        errorMsg.style.opacity = '1';
        pinBox.classList.add('shake');
        setTimeout(() => pinBox.classList.remove('shake'), 500);
        input.focus();
      }
    });
    
    // Auto-focus input on load
    window.onload = () => input.focus();
  </script>
</body>
</html>
